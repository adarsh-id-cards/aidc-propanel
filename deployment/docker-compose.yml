# =============================================================================
# Pro Panel — Production Docker Compose Orchestration
# =============================================================================
# Usage:
#   1. Copy backend/.env.example to .env and configure production credentials
#   2. Build and start services:
#      docker compose -f deployment/docker-compose.yml up -d --build
#   3. Run migrations:
#      docker compose -f deployment/docker-compose.yml exec backend python manage.py migrate
# =============================================================================

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-propanel_db}
      POSTGRES_USER: ${POSTGRES_USER:-propanel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_strong_db_password}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-propanel_user} -d ${POSTGRES_DB:-propanel_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - propanel_internal

  # ── Redis (Cache, Sessions & WebSocket Channel Layer) ──────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - propanel_internal

  # ── Django ASGI Backend (Gunicorn + UvicornWorker) ────────────────────────
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../backend/.env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-propanel_user}:${POSTGRES_PASSWORD:-change_this_strong_db_password}@db:5432/${POSTGRES_DB:-propanel_db}
      - REDIS_URL=redis://redis:6379/1
      - GUNICORN_BIND=0.0.0.0:8000
    volumes:
      - media_data:/app/backend/media
      - static_data:/app/backend/staticfiles
    networks:
      - propanel_internal
    expose:
      - "8000"

  # ── Optional Celery Worker (for offloading PDF/ZIP/export heavy jobs) ───────
  # Uncomment if running asynchronous task queues:
  # celery_worker:
  #   build:
  #     context: ..
  #     dockerfile: deployment/Dockerfile
  #   command: celery -A config worker -l info --concurrency=2
  #   restart: always
  #   depends_on:
  #     - backend
  #     - redis
  #     - db
  #   env_file:
  #     - ../backend/.env
  #   volumes:
  #     - media_data:/app/backend/media
  #   networks:
  #     - propanel_internal

  # ── Nginx Web Server (Reverse Proxy & Static/Media Direct Server) ───────────
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx_example.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/var/www/pro-panel/frontend/dist:ro
      - static_data:/var/www/pro-panel/backend/staticfiles:ro
      - media_data:/var/www/pro-panel/backend/media:ro
      - certs_data:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - propanel_internal

networks:
  propanel_internal:
    driver: bridge

volumes:
  db_data:
  redis_data:
  media_data:
  static_data:
  certs_data:

