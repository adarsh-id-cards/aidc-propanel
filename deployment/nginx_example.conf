# =============================================================================
# Pro Panel — Enterprise Production Nginx Configuration
# =============================================================================
# Architecture:
# - Frontend: Main Domain (e.g. propanel.adarshbhopal.in)
#     * Serves built React 19 SPA from /var/www/pro-panel/frontend/dist
#     * Proxies /api/, /auth/, /media/, /ws/, /app/ to Django ASGI (127.0.0.1:8000)
#     * Solves CORS & SameSite Cookie problems natively via same-origin routing!
# - Backend API: Subdomain (e.g. api.propanel.adarshbhopal.in)
#     * Dedicated endpoint for Desktop App, Mobile Flutter App, and External APIs
# =============================================================================

# ── UPSTREAM: Backend Django ASGI Server (Daphne / Uvicorn) ──────────────────
upstream django_backend {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# =============================================================================
# 1. MAIN DOMAIN: Frontend SPA + Same-Origin API Proxy (propanel.adarshbhopal.in)
# =============================================================================

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name propanel.adarshbhopal.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name propanel.adarshbhopal.in;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/propanel.adarshbhopal.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propanel.adarshbhopal.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    client_max_body_size 512M;
    client_body_buffer_size 128k;

    # Root Directory for built React 19 SPA
    root /var/www/pro-panel/frontend/dist;
    index index.html;

    # ── Same-Origin API Endpoints ─────────────────────────────────────────────
    location ~ ^/(api|auth|app|admin|roshan-pro-admin)/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Real-Time WebSockets (/ws/) ──────────────────────────────────────────
    location /ws/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Django Admin / System Static Assets ──────────────────────────────────
    location /static/ {
        alias /var/www/pro-panel/backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Media Auth Check & Serving ───────────────────────────────────────────
    location /media/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── Protected Media Serving via X-Accel-Redirect ─────────────────────────
    location /protected-media/ {
        internal;
        alias /var/www/pro-panel/backend/media/;
    }

    # ── Frontend Bundled Static Assets ───────────────────────────────────────
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── React SPA Client-Side Routing (Fallback to index.html) ───────────────
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}


# =============================================================================
# 2. API SUBDOMAIN: Mobile App & Desktop App Endpoint (api.propanel.adarshbhopal.in)
# =============================================================================

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.propanel.adarshbhopal.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.propanel.adarshbhopal.in;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/api.propanel.adarshbhopal.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.propanel.adarshbhopal.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Upload Limits
    client_max_body_size 512M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # ── Static Assets ────────────────────────────────────────────────────────
    location /static/ {
        alias /var/www/pro-panel/backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Protected Media Serving via X-Accel-Redirect ─────────────────────────
    location /protected-media/ {
        internal;
        alias /var/www/pro-panel/backend/media/;
    }

    # ── Media Auth Check & Serving ───────────────────────────────────────────
    location /media/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── Django Channels Real-Time WebSockets (/ws/) ──────────────────────────
    location /ws/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── All API Endpoints & Auth ─────────────────────────────────────────────
    location / {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
