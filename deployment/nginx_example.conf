# =============================================================================
# Pro Panel — Enterprise Nginx Production Configuration
# =============================================================================
# Architecture:
# - Frontend: React 19 SPA (Vite) served directly from dist/
# - Backend: Django 5.2 ASGI / Gunicorn on 127.0.0.1:8000
# - Real-time: WebSocket upgrade for Django Channels
# - Security: Internal X-Accel-Redirect for protected media files
# =============================================================================

upstream django_backend {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# ── HTTP -> HTTPS Redirect ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;
    return 301 https://$host$request_uri;
}

# ── Primary HTTPS Server ──────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # SSL Certificates (e.g., Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Max upload limit (matches backend DATA_UPLOAD_MAX_MEMORY_SIZE: 512M)
    client_max_body_size 512M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Root directory for built React SPA
    root /var/www/pro-panel/frontend/dist;
    index index.html;

    # ── 1. React SPA Client-Side Routing ─────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── 2. Vite Bundled Static Assets (Immutable Caching) ─────────────────────
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── 3. Django Staticfiles (Collected via collectstatic) ───────────────────
    location /static/ {
        alias /var/www/pro-panel/backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── 4. Protected Media Serving via X-Accel-Redirect ──────────────────────
    # Internal location — client cannot request this directly.
    # Django validates auth, then sends 'X-Accel-Redirect: /protected-media/<path>'.
    location /protected-media/ {
        internal;
        alias /var/www/pro-panel/backend/media/;
    }

    # ── 5. Media Routing (Auth Gate) ─────────────────────────────────────────
    # Dispatched to Django auth check first before X-Accel offload
    location /media/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── 6. Django REST API & Auth Endpoints ───────────────────────────────────
    location ~ ^/(api|auth|panel|organisations|assistants|operators|staff|tables|reprint|stats|operations|imports|exports|images|app)/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 7. Django Channels WebSocket Support ─────────────────────────────────
    location /ws/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

