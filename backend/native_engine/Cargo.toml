[package]
name = "cardflow_engine"
version = "1.0.0"
edition = "2021"
authors = ["CardFlow Team"]
description = "High-performance native acceleration engine for CardFlow ID card operations (parallel ZIP, ingestion, vector PDF)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
zip = { version = "2.2", default-features = false, features = ["deflate", "time"] }
flate2 = "1.0"
calamine = "0.26"
quick-xml = { version = "0.36", features = ["serialize"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
